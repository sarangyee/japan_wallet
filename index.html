:root{
  --bg:#EDF3F8;--paper:#FFFFFF;--ink:#18212B;--muted:#5C6773;--line:#D6DEE6;--field:#F4F7FA;
  --red:#D63B45;--red-soft:rgba(214,59,69,.1);--pos:#178A52;
  --accent:#178A52;--accent-2:#3CC47F;--on:#FFFFFF;--tint:rgba(60,196,127,.16);--link:var(--accent);
  --sky1:#4A9BE8;--sky2:#9CD0F5;--sky3:#FFE6D2;--sun:#F0555A;--glow:#FFFFFF;--glow-o:.28;--star-o:0;--cloud:#FFFFFF;--cloud-shade:#CFE3F7;
  --fuji:#6E8FCB;--fuji-shade:#4B69A8;--snow:#FFFFFF;--snow-shade:#D6E4F7;--mist:#FFFFFF;--hill-far:#7FB6A0;
  --hill-near:#4FA064;--hill-front:#3B8A55;--tree:#2F7447;--petal:#FFB8CA;
  color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-tab="settle"]{--accent:#178A52;--accent-2:#3CC47F;--on:#FFFFFF;--tint:rgba(60,196,127,.16)}
:root[data-tab="budget"]{--accent:#2468C8;--accent-2:#5AA2F5;--on:#FFFFFF;--tint:rgba(90,162,245,.16)}
:root[data-tab="fx"]{--accent:#F29A1F;--accent-2:#FFC15E;--on:#2B1A00;--tint:rgba(255,193,94,.22)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626;--paper:#19223A;--ink:#E8EDF7;--muted:#9AA6BC;--line:#2A3552;--field:#131A2E;
    --red:#FF6B74;--red-soft:rgba(255,107,116,.14);--pos:#5ADB9A;--link:var(--accent-2);color-scheme:dark;
    --sky1:#0E1A3A;--sky2:#2A3D7A;--sky3:#8F72AE;--sun:#F6F0C8;--glow:#F6F0C8;--glow-o:.2;--star-o:.9;--cloud:#5E6EA6;--cloud-shade:#414F86;
    --fuji:#3B518F;--fuji-shade:#293A72;--snow:#DCE4FA;--snow-shade:#A9B8E0;--mist:#9A8FC4;--hill-far:#2C4B66;
    --hill-near:#1F4B40;--hill-front:#173C34;--tree:#12312B;--petal:#E8A3C2;
  }
}
:root[data-theme="dark"]{
    --bg:#0F1626;--paper:#19223A;--ink:#E8EDF7;--muted:#9AA6BC;--line:#2A3552;--field:#131A2E;
    --red:#FF6B74;--red-soft:rgba(255,107,116,.14);--pos:#5ADB9A;--link:var(--accent-2);color-scheme:dark;
    --sky1:#0E1A3A;--sky2:#2A3D7A;--sky3:#8F72AE;--sun:#F6F0C8;--glow:#F6F0C8;--glow-o:.2;--star-o:.9;--cloud:#5E6EA6;--cloud-shade:#414F86;
    --fuji:#3B518F;--fuji-shade:#293A72;--snow:#DCE4FA;--snow-shade:#A9B8E0;--mist:#9A8FC4;--hill-far:#2C4B66;
    --hill-near:#1F4B40;--hill-front:#173C34;--tree:#12312B;--petal:#E8A3C2;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 후지산 풍경 */
.statusbg{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--sky1);z-index:30}
.hero{position:relative;max-width:520px;margin:0 auto;overflow:hidden;background:var(--sky1);
  height:calc(210px + env(safe-area-inset-top,0px))}
.hero svg{display:block;width:100%;height:100%}
.drift{animation:drift 26s ease-in-out infinite alternate}
.d2{animation-duration:34s;animation-delay:-8s}
.d3{animation-duration:30s;animation-delay:-14s}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(18px)}}
@media (prefers-reduced-motion:reduce){.drift{animation:none}}

/* 역 이름판(駅名標) = 화면 이동 */
.sign{position:relative;z-index:2;margin:-56px 0 20px;background:var(--paper);
  border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.sign-body{text-align:center;padding:14px 12px 10px}
.badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid var(--accent);border-radius:6px;min-width:38px;padding:1px 4px;
  font-weight:700;font-size:15px;line-height:1.05;margin-bottom:6px}
.badge small{font-size:9px;font-weight:700}
.sign-ko{font-size:36px;font-weight:700;letter-spacing:.12em;line-height:1.15;padding-left:.12em}
.sign-en{font-size:13px;color:var(--muted)}
.band{background:var(--accent);display:grid;grid-template-columns:1fr 1fr}
.band button{background:none;border:0;color:var(--on);font-weight:500;padding:9px 14px;min-height:46px;text-align:left}
.band button.r{text-align:right}

.sec{margin:0 0 22px}
.sec h2{font-size:15px;font-weight:700;margin:0 0 8px}
.count{font-weight:400;color:var(--muted);font-size:14px}
.box{background:var(--paper);border-radius:10px;padding:14px;border:1px solid var(--line)}
.box.list{padding:2px 14px}
.mt{margin-top:10px}
.row{display:flex;gap:8px;align-items:stretch}
.grow{flex:1;min-width:0}
.lbl{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
.between{display:flex;justify-content:space-between;align-items:center}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.in{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--field);color:var(--ink);-webkit-appearance:none;appearance:none}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.in{resize:vertical;font-size:14px}

/* 버튼: 기본은 탭 색, 지우기는 빨강 */
.btn{width:100%;background:var(--accent);color:var(--on);border:0;border-radius:8px;padding:12px;font-weight:700}
.btn.sm{width:auto;padding:10px 16px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--link);font-size:14px;font-weight:500;padding:4px 0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.chip .x{background:none;border:0;color:var(--red);font-size:18px;line-height:1;padding:0 0 0 4px}
.me{font-size:11px;background:var(--ink);color:var(--paper);border-radius:4px;padding:0 5px;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--field);border:0;padding:0 14px;font-size:15px;min-width:48px}
.seg button.on{background:var(--accent);color:var(--on);font-weight:700}

.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.meta{font-size:13px;color:var(--muted)}
.right{display:flex;align-items:center;gap:8px;flex:none}
.del{background:var(--red-soft);border:0;color:var(--red);border-radius:8px;width:36px;height:36px;
  font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.neg{color:var(--red)}
.pos{color:var(--pos)}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px}

/* 정산 영수증 */
.receipt{background:var(--paper);padding:20px 18px 24px;position:relative;margin-bottom:10px;border-radius:4px 4px 0 0;border-top:6px solid var(--accent)}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;
  background:radial-gradient(circle at 7px 0,var(--paper) 6.5px,transparent 7px) 0 0/14px 8px repeat-x}
.receipt h3{text-align:center;margin:0;font-size:18px;letter-spacing:.3em;padding-left:.3em}
.r-sub{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 0}
.dash{border-top:1px dashed var(--muted);margin:14px 0;opacity:.6}
.r-head{font-size:13px;color:var(--muted);margin:0 0 6px}
.r-row{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.r-row.sub{font-size:13px;color:var(--muted);padding-top:0}
.tr{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tr .amt{text-align:right}
.tr .amt div:first-child{font-weight:700;font-size:17px}

/* 예산 */
.left-label{font-size:14px;color:var(--muted)}
.left-amt{font-size:34px;font-weight:700;line-height:1.2;margin:2px 0}
.bar{height:10px;background:var(--field);border-radius:5px;overflow:hidden;border:1px solid var(--line);margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.warn i{background:#F29A1F}
.bar.over i{background:var(--red)}
.cat-bar{height:4px;background:var(--field);border-radius:2px;margin-top:5px;overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--accent)}

/* 환율 */
.rate-big{font-size:28px;font-weight:700;line-height:1.2}
.fx-out{font-size:30px;font-weight:700;margin-top:12px;min-height:44px}
.in.big{font-size:22px;font-weight:500}

details.backup{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
details.backup summary{font-size:14px;color:var(--muted);padding:6px 0;cursor:pointer}

.sig{font-family:Sig,"Snell Roundhand","Apple Chancery",cursive;font-weight:600;letter-spacing:.01em}
.receipt .signoff{text-align:right;font-size:19px;color:var(--muted);margin:2px 2px -4px;line-height:1.2}
.made{text-align:center;margin:34px 0 4px;color:var(--muted);font-size:22px;line-height:1.3}
.made::before{content:"";display:block;width:36px;height:3px;background:var(--accent);border-radius:2px;margin:0 auto 12px}


/* 정산 기능: 메뉴별 나누기, 사진, 수정 */
.seg.full{display:flex;width:100%}.seg.full button{flex:1;padding:10px 8px}
.itm{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:var(--field)}
.itm .in{background:var(--paper)}
.chip.s{padding:5px 11px;font-size:13px}
.sumbox{margin-top:12px;border-top:1px dashed var(--muted);padding-top:10px}
.hint.neg{color:var(--red)}
.item.exp{align-items:flex-start}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.btns{display:flex;gap:6px}
.edit{background:var(--tint);color:var(--link);border:0;border-radius:8px;height:36px;padding:0 12px;font-size:14px;font-weight:500}
.editing{background:var(--tint);margin:0 -14px;padding-left:14px;padding-right:14px}
details.mini{margin-top:6px}
details.mini summary{font-size:13px;color:var(--link);cursor:pointer;padding:2px 0}
.mini .r-row{font-size:13px;color:var(--muted);gap:10px;padding:2px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--field);display:block;cursor:pointer}
.thumb.missing{opacity:.35}
.tw{position:relative}
.tw .del{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;font-size:16px;background:var(--paper);border:1px solid var(--red)}
.addph{width:60px;height:60px;border-radius:8px;border:1.5px dashed var(--accent);background:var(--tint);color:var(--link);font-size:13px;font-weight:500;line-height:1.2}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.vclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:26px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;

<script>
const KEY = 'tokyo-wallet-v1';
const TABS = [
  {id:'settle', ko:'정산', en:'Settle up', no:'01'},
  {id:'budget', ko:'예산', en:'My budget', no:'02'},
  {id:'fx',     ko:'환율', en:'Exchange',  no:'03'}
];
const CATS = ['식비','교통','쇼핑','관광','숙소','기타'];

function defaults(){
  return {members:[], meId:null, expenses:[], personal:[], budget:0,
          rate:{value:9.5, updated:null, source:'default'}};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return Object.assign(defaults(), JSON.parse(raw));
  }catch(e){}
  return defaults();
}
let S = load();
let tab = 0;
try{ tab = +localStorage.getItem(KEY+':tab') || 0; }catch(e){}
if(!(tab >= 0 && tab < TABS.length)) tab = 0;

function blankItem(){ return {name:'', price:'', eaters:new Set()}; }
function newForm(){
  return {id:null, title:'', amt:'', cur:'JPY', payer:null, parts:new Set(S.members.map(m => m.id)),
          mode:'equal', items:[blankItem()], pct:'', photos:[], newPhotos:[], removed:[]};
}
let F = newForm();
let perCur = 'JPY', perCat = '식비', fxDir = 'J2K';

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('저장하지 못했어요. 데이터 백업을 해 두세요.'); }
}

/* ---------- 도우미 ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(/[,\s원¥]/g,'')); return isFinite(n) ? n : NaN; };
const toJPY = (a,cur) => cur === 'JPY' ? a : a / S.rate.value;
const toKRW = (a,cur) => cur === 'KRW' ? a : a * S.rate.value;
const fmtY = n => '¥' + Math.round(n).toLocaleString('ko-KR');
const fmtW = n => Math.round(n).toLocaleString('ko-KR') + '원';
const money = (a,cur) => cur === 'JPY' ? fmtY(a) : fmtW(a);
const name = id => (S.members.find(m => m.id === id) || {name:'(삭제됨)'}).name;
const pad = n => String(n).padStart(2,'0');
const dateStr = d => `${d.getMonth()+1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const rateText = () => (S.rate.value*100).toLocaleString('ko-KR',{maximumFractionDigits:1}) + '원';

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function seg(act, val){
  return `<div class="seg" role="group" aria-label="통화">
    <button data-act="${act}" data-v="JPY" class="${val==='JPY'?'on':''}" aria-pressed="${val==='JPY'}">엔</button>
    <button data-act="${act}" data-v="KRW" class="${val==='KRW'?'on':''}" aria-pressed="${val==='KRW'}">원</button></div>`;
}
function segSet(b){
  b.parentElement.querySelectorAll('button').forEach(x => {
    x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b);
  });
}

/* ---------- 정산 계산 ---------- */
function expShares(e){
  const o = {};
  if(e.shares){ for(const id in e.shares) o[id] = toJPY(e.shares[id], e.cur); return o; }
  const y = toJPY(e.amount, e.cur);
  e.parts.forEach(p => o[p] = y / e.parts.length);
  return o;
}
function settle(){
  const bal = {}, paid = {}, share = {};
  S.members.forEach(m => { bal[m.id] = 0; paid[m.id] = 0; share[m.id] = 0; });
  let total = 0;
  S.expenses.forEach(e => {
    if(!(e.payer in bal)) return;
    const sh = expShares(e), ids = Object.keys(sh).filter(id => id in bal);
    if(!ids.length) return;
    const y = toJPY(e.amount, e.cur);
    total += y; bal[e.payer] += y; paid[e.payer] += y;
    ids.forEach(id => { bal[id] -= sh[id]; share[id] += sh[id]; });
  });
  // 받을 사람(+)과 보낼 사람(-)을 큰 금액부터 짝지어 송금 횟수를 줄임
  const cr = [], db = [];
  for(const id in bal){
    if(bal[id] > 0.5) cr.push({id, v:bal[id]});
    else if(bal[id] < -0.5) db.push({id, v:-bal[id]});
  }
  cr.sort((a,b) => b.v - a.v); db.sort((a,b) => b.v - a.v);
  const tr = []; let i = 0, j = 0;
  while(i < db.length && j < cr.length){
    const x = Math.min(db[i].v, cr[j].v);
    tr.push({from:db[i].id, to:cr[j].id, y:x});
    db[i].v -= x; cr[j].v -= x;
    if(db[i].v < 0.5) i++;
    if(cr[j].v < 0.5) j++;
  }
  return {bal, paid, share, total, tr};
}
function myShareJPY(){
  if(!S.meId) return 0;
  return S.expenses.reduce((s,e) => s + (expShares(e)[S.meId] || 0), 0);
}

/* 메뉴별 나누기 계산 */
function calcItems(){
  const pct = num(F.pct), mult = 1 + (pct > 0 ? pct : 0) / 100;
  const shares = {}, clean = [], errs = [];
  F.items.forEach((it, idx) => {
    const price = num(it.price), nm = it.name.trim();
    if(!(price > 0) && !nm) return;
    const label = nm || `메뉴 ${idx + 1}`;
    if(!(price > 0)){ errs.push(`${label}의 가격을 입력하세요`); return; }
    const eaters = [...it.eaters].filter(id => S.members.some(m => m.id === id));
    if(!eaters.length){ errs.push(`먹은 사람을 고르세요 (${label})`); return; }
    const each = price * mult / eaters.length;
    eaters.forEach(id => shares[id] = (shares[id] || 0) + each);
    clean.push({name:label, price, eaters});
  });
  let total = 0;
  for(const id in shares){ shares[id] = Math.round(shares[id]); total += shares[id]; }
  return {shares, total, clean, errs};
}
function sumHTML(){
  const r = calcItems();
  let h = '';
  if(r.clean.length){
    h += `<div class="r-row"><b>합계</b><b class="num">${money(r.total, F.cur)}</b></div>`;
    h += Object.keys(r.shares).filter(id => r.shares[id] > 0).map(id =>
      `<div class="r-row sub"><span>${esc(name(id))}</span><span class="num">${money(r.shares[id], F.cur)}</span></div>`).join('');
  } else {
    h += `<p class="hint" style="margin:0">메뉴와 가격을 넣고 먹은 사람을 고르면 사람별 금액이 여기에 나와요.</p>`;
  }
  if(r.errs.length) h += `<p class="hint neg">${esc(r.errs[0])}${r.errs.length > 1 ? ` 외 ${r.errs.length - 1}건` : ''}</p>`;
  return h;
}
function updateSummary(){ const el = $('#itemSum'); if(el) el.innerHTML = sumHTML(); }

/* 영수증 사진 (이 폰의 IndexedDB에 저장) */
const PH = {
  db:null,
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if(!window.indexedDB) return rej(new Error('no indexedDB'));
      const r = indexedDB.open('tokyo-wallet-photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('p');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('p', mode), rq = fn(t.objectStore('p'));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  },
  put(id, blob){ return this.tx('readwrite', s => s.put(blob, id)); },
  get(id){ return this.tx('readonly', s => s.get(id)); },
  del(id){ return this.tx('readwrite', s => s.delete(id)).catch(() => {}); },
  keys(){ return this.tx('readonly', s => s.getAllKeys()); }
};
const urlCache = {};
function compressImage(file, max = 1400, q = 0.72){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(bl => bl ? res(bl) : rej(new Error('encode')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('load')); };
    img.src = url;
  });
}
async function addPhotos(files){
  let ok = 0;
  for(const f of files){
    if(F.photos.length >= 6){ toast('사진은 지출마다 6장까지 넣을 수 있어요.'); break; }
    try{
      const blob = await compressImage(f), id = 'p' + uid();
      await PH.put(id, blob);
      F.photos.push(id); F.newPhotos.push(id); ok++;
    }catch(e){ toast('사진을 저장하지 못했어요. 비공개 탭에서는 저장이 안 돼요.'); break; }
  }
  if(ok){ renderForm(); toast(`사진 ${ok}장을 넣었어요.`); }
}
async function hydratePhotos(root){
  const imgs = [...(root || document).querySelectorAll('img[data-pid]')];
  for(const im of imgs){
    const id = im.dataset.pid;
    if(urlCache[id]){ im.src = urlCache[id]; continue; }
    try{
      const bl = await PH.get(id);
      if(bl){ urlCache[id] = URL.createObjectURL(bl); im.src = urlCache[id]; }
      else im.classList.add('missing');
    }catch(e){ im.classList.add('missing'); }
  }
}
function dropPhoto(id){ PH.del(id); if(urlCache[id]){ URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; } }
async function cleanPhotos(){
  try{
    const keys = await PH.keys();
    const used = new Set(S.expenses.flatMap(e => e.photos || []));
    F.photos.forEach(x => used.add(x));
    for(const k of keys) if(!used.has(k)) dropPhoto(k);
  }catch(e){}
}
async function openPhoto(id){
  const v = $('#viewer'), im = v.querySelector('img');
  if(!urlCache[id]){
    try{ const bl = await PH.get(id); if(bl) urlCache[id] = URL.createObjectURL(bl); }catch(e){}
  }
  if(!urlCache[id]){ toast('이 폰에 저장된 사진이 아니에요.'); return; }
  im.src = urlCache[id]; v.hidden = false;
}
function closePhoto(){ const v = $('#viewer'); v.hidden = true; v.querySelector('img').removeAttribute('src'); }

/* 정산 결과 글자로 만들기 */
function resultText(){
  const r = settle(), L = [];
  L.push(`[도쿄 정산] ${dateStr(new Date())} 기준, ¥100 = ${rateText()}`);
  L.push(`총 지출 ${fmtY(r.total)} (약 ${fmtW(r.total * S.rate.value)})`);
  L.push('');
  L.push('이렇게 보내면 끝');
  if(r.tr.length) r.tr.forEach(t => L.push(`${name(t.from)} → ${name(t.to)}  ${fmtY(t.y)} (약 ${fmtW(t.y * S.rate.value)})`));
  else L.push('보낼 돈이 없어요');
  L.push('');
  L.push('사람별 (낸 돈 / 내 몫)');
  S.members.forEach(x => L.push(`${x.name}  ${fmtY(r.paid[x.id])} / ${fmtY(r.share[x.id])}`));
  L.push('');
  L.push('지출 내역');
  S.expenses.forEach(e => L.push(`${e.title}  ${money(e.amount, e.cur)} (${name(e.payer)} 결제)`));
  return L.join('\n');
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* 입력 중인 지출 폼 */
function discardForm(){ F.newPhotos.forEach(dropPhoto); }
function formDirty(){
  return F.newPhotos.length > 0 || (!F.id && (F.title.trim() || num(F.amt) > 0 || F.photos.length ||
    F.items.some(it => it.name.trim() || num(it.price) > 0)));
}
function fromExpense(e){
  const f = newForm();
  f.id = e.id; f.title = e.title; f.cur = e.cur; f.payer = e.payer;
  f.parts = new Set(e.parts); f.photos = [...(e.photos || [])];
  f.amt = Number(e.amount).toLocaleString('ko-KR', {maximumFractionDigits:2});
  if(e.items){
    f.mode = 'items'; f.pct = e.pct > 0 ? String(e.pct) : '';
    f.items = e.items.map(it => ({name:it.name, price:Number(it.price).toLocaleString('ko-KR', {maximumFractionDigits:2}), eaters:new Set(it.eaters)}));
  }
  return f;
}
function renderForm(){
  const el = $('#expForm'); if(!el) return;
  el.innerHTML = formInner(); hydratePhotos(el);
}
function syncForm(t){
  const k = t.dataset.f, i = +t.dataset.i;
  if(k === 'title') F.title = t.value;
  else if(k === 'amt') F.amt = t.value;
  else if(k === 'pct'){ F.pct = t.value; updateSummary(); }
  else if(k === 'iname') F.items[i].name = t.value;
  else if(k === 'iprice'){ F.items[i].price = t.value; updateSummary(); }
}

/* ---------- 화면: 정산 ---------- */
function formInner(){
  const m = S.members, editing = !!F.id, items = F.mode === 'items';
  if(!m.some(x => x.id === F.payer)) F.payer = (S.meId && m.some(x => x.id === S.meId)) ? S.meId : m[0].id;
  const chips = (sel, act, extra, cls) => m.map(x =>
    `<button class="chip${cls || ''}${sel(x.id) ? ' on' : ''}" data-act="${act}" data-id="${x.id}" ${extra || ''} aria-pressed="${sel(x.id)}">${esc(x.name)}</button>`).join('');
  let h = `<div class="between" style="margin-bottom:8px"><h2 style="margin:0">${editing ? '지출 수정' : '지출 추가'}</h2>${editing ? '<button class="link" data-act="cancelEdit">수정 취소</button>' : ''}</div><div class="box">`;
  h += `<input class="in" data-f="title" placeholder="내용 (예: 이자카야 저녁)" maxlength="30" autocomplete="off" value="${esc(F.title)}">`;
  h += `<div class="seg full mt" role="group" aria-label="나누는 방식">
    <button data-act="fmode" data-v="equal" class="${!items ? 'on' : ''}" aria-pressed="${!items}">똑같이 나누기</button>
    <button data-act="fmode" data-v="items" class="${items ? 'on' : ''}" aria-pressed="${items}">메뉴별로 나누기</button></div>`;
  if(!items){
    h += `<div class="row mt"><input class="in grow num" data-f="amt" data-money inputmode="decimal" placeholder="금액" autocomplete="off" value="${esc(F.amt)}">${seg('expCur', F.cur)}</div>`;
  } else {
    h += `<div class="between mt"><span class="meta">메뉴 가격의 통화</span>${seg('expCur', F.cur)}</div>`;
  }
  h += `<label class="lbl" for="expPayer">결제한 사람</label>
    <select id="expPayer" class="in" data-f="payer">${m.map(x => `<option value="${x.id}"${x.id === F.payer ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`;
  if(!items){
    h += `<div class="lbl between"><span>나눌 사람</span><button class="link" data-act="splitAll">전원 선택</button></div>
      <div class="chips" id="splitChips">${chips(id => F.parts.has(id), 'split')}</div>`;
  } else {
    h += F.items.map((it, i) => `<div class="itm">
      <div class="row" style="align-items:center">
        <input class="in grow" data-f="iname" data-i="${i}" placeholder="메뉴 (예: 라멘)" maxlength="24" autocomplete="off" value="${esc(it.name)}">
        <input class="in num" style="width:104px;flex:none" data-f="iprice" data-i="${i}" data-money inputmode="decimal" placeholder="가격" autocomplete="off" value="${esc(it.price)}">
        <button class="del" data-act="rmItem" data-i="${i}" aria-label="메뉴 지우기">×</button></div>
      <div class="between" style="margin-top:10px"><span class="meta">먹은 사람</span><button class="link" data-act="eaterAll" data-i="${i}">전원</button></div>

async function refreshRate(silent){
  const btn = $('#rateBtn');
  if(btn){ btn.disabled = true; btn.textContent = '불러오는 중…'; }
  const sources = [
    ['https://open.er-api.com/v6/latest/JPY', d => d && d.rates && d.rates.KRW],
    ['https://api.frankfurter.app/latest?from=JPY&to=KRW', d => d && d.rates && d.rates.KRW]
  ];
  for(const [url, pick] of sources){
    try{
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
      const res = await fetch(url, {signal:ctl.signal, cache:'no-store'});
      clearTimeout(tm);
      if(!res.ok) continue;
      const v = +pick(await res.json());
      if(v > 0 && v < 100){
        S.rate = {value:v, updated:new Date().toISOString(), source:'auto'};
        save();
        const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if(!(silent && typing)) render();
        if(!silent) toast('최신 환율을 불러왔어요.');
        return;
      }
    }catch(e){}
  }
  if(btn){ btn.disabled = false; btn.textContent = '최신 환율 불러오기'; }
  if(!silent) toast('환율을 불러오지 못했어요. 인터넷 연결을 확인하거나 직접 입력하세요.');
}

const A = {
  addMember(){
    const el = $('#memName'), n = el.value.trim();
    if(!n){ toast('이름을 입력하세요.'); el.focus(); return; }
    if(S.members.some(m => m.name === n)){ toast('같은 이름이 이미 있어요.'); return; }
    const m = {id:uid(), name:n};
    S.members.push(m); F.parts.add(m.id); save(); render();
  },
  rmMember(b){
    const id = b.dataset.id;
    if(S.expenses.some(e => e.payer === id || e.parts.includes(id))){
      toast('이 사람이 들어간 지출을 먼저 지우세요.'); return;
    }
    S.members = S.members.filter(m => m.id !== id);
    F.parts.delete(id); F.items.forEach(it => it.eaters.delete(id));
    if(F.payer === id) F.payer = null;
    if(S.meId === id) S.meId = null;
    save(); render();
  },
  fmode(b){
    F.mode = b.dataset.v;
    if(!F.items.length) F.items = [blankItem()];
    renderForm();
  },
  expCur(b){ F.cur = b.dataset.v; segSet(b); updateSummary(); },
  split(b){
    const id = b.dataset.id;
    F.parts.has(id) ? F.parts.delete(id) : F.parts.add(id);
    b.classList.toggle('on', F.parts.has(id)); b.setAttribute('aria-pressed', F.parts.has(id));
  },
  splitAll(){
    S.members.forEach(m => F.parts.add(m.id));
    document.querySelectorAll('#splitChips .chip').forEach(c => { c.classList.add('on'); c.setAttribute('aria-pressed','true'); });
  },
  addItem(){
    F.items.push(blankItem()); renderForm();
    const els = document.querySelectorAll('[data-f="iname"]'); if(els.length) els[els.length - 1].focus();
  },
  rmItem(b){
    F.items.splice(+b.dataset.i, 1);
    if(!F.items.length) F.items = [blankItem()];
    renderForm();
  },
  toggleEater(b){
    const it = F.items[+b.dataset.i], id = b.dataset.id;
    it.eaters.has(id) ? it.eaters.delete(id) : it.eaters.add(id);
    b.classList.toggle('on', it.eaters.has(id)); b.setAttribute('aria-pressed', it.eaters.has(id));
    updateSummary();
  },
  eaterAll(b){ F.items[+b.dataset.i].eaters = new Set(S.members.map(m => m.id)); renderForm(); },
  pickPhoto(){ $('#photoIn').click(); },
  rmPhoto(b){
    const id = b.dataset.id;
    F.photos = F.photos.filter(x => x !== id);
    if(F.newPhotos.includes(id)){ F.newPhotos = F.newPhotos.filter(x => x !== id); dropPhoto(id); }
    else F.removed.push(id);
    renderForm();
  },
  viewPhoto(b){ openPhoto(b.dataset.id); },
  closePhoto(){ closePhoto(); },
  editExp(b){
    const e = S.expenses.find(x => x.id === b.dataset.id); if(!e) return;
    if(formDirty() && !confirm('작성 중이던 내용이 사라져요. 이 지출을 수정할까요?')) return;
    discardForm(); F = fromExpense(e); render();
    const el = $('#expForm'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  },
  cancelEdit(){ discardForm(); F = newForm(); render(); },
  addExp(){
    if(!S.members.length) return;
    const title = F.title.trim() || '지출';
    let exp;
    if(F.mode === 'items'){
      const r = calcItems();
      if(r.errs.length){ toast(r.errs[0]); return; }
      if(!r.clean.length){ toast('메뉴와 가격을 입력하세요.'); return; }
      const pct = num(F.pct);
      exp = {title, amount:r.total, cur:F.cur, payer:F.payer,
             parts:Object.keys(r.shares).filter(id => r.shares[id] > 0), shares:r.shares,
             items:r.clean.map(it => ({name:it.name, price:it.price, eaters:it.eaters})), pct:pct > 0 ? pct : 0};
    } else {
      const a = num(F.amt);
      if(!(a > 0)){ toast('금액을 입력하세요.'); const el = document.querySelector('[data-f="amt"]'); if(el) el.focus(); return; }
      const parts = S.members.filter(m => F.parts.has(m.id)).map(m => m.id);
      if(!parts.length){ toast('나눌 사람을 한 명 이상 고르세요.'); return; }
      exp = {title, amount:a, cur:F.cur, payer:F.payer, parts};
    }
    exp.photos = [...F.photos];
    const wasEdit = !!F.id;
    if(wasEdit){
      const i = S.expenses.findIndex(e => e.id === F.id);
      exp.id = F.id; exp.ts = i >= 0 ? S.expenses[i].ts : Date.now();
      if(i >= 0) S.expenses[i] = exp; else S.expenses.push(exp);
      F.removed.forEach(dropPhoto);
    } else { exp.id = uid(); exp.ts = Date.now(); S.expenses.push(exp); }
    save(); F = newForm(); render(); toast(wasEdit ? '지출을 수정했어요.' : '지출을 추가했어요.');
  },
  rmExp(b){
    if(!confirm('이 지출을 지울까요? 붙여 둔 사진도 같이 지워져요.')) return;
    const e = S.expenses.find(x => x.id === b.dataset.id);
    if(e && e.photos) e.photos.forEach(dropPhoto);
    if(F.id === b.dataset.id) F = newForm();
    S.expenses = S.expenses.filter(x => x.id !== b.dataset.id); save(); render();
  },
  async copyResult(){
    toast(await copyText(resultText()) ? '정산 결과를 복사했어요. 카톡에 붙여넣으세요.' : '복사하지 못했어요. 공유하기를 써 보세요.');
  },
  async shareResult(){
    try{ await navigator.share({text:resultText()}); }catch(e){}
  },
  go(b){
    tab = +b.dataset.to;
    try{ localStorage.setItem(KEY+':tab', tab); }catch(e){}
    render(); window.scrollTo(0,0);
  },
  perCur(b){ perCur = b.dataset.v; segSet(b); },
  perCat(b){ perCat = b.dataset.v; b.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); },
  setBudget(){
    const a = num($('#budIn').value);
    if(!(a >= 0)){ toast('예산을 원 단위 숫자로 입력하세요.'); return; }
    S.budget = a; save(); render(); toast('예산을 저장했어요.');
  },
  addPer(){
    const title = $('#perTitle').value.trim() || perCat;
    const a = num($('#perAmt').value);
    if(!(a > 0)){ toast('금액을 입력하세요.'); $('#perAmt').focus(); return; }
    S.personal.push({id:uid(), title, amount:a, cur:perCur, cat:perCat, ts:Date.now()});
    save(); render(); toast('내 지출을 추가했어요.');
  },
  rmPer(b){
    if(!confirm('이 지출을 지울까요?')) return;
    S.personal = S.personal.filter(p => p.id !== b.dataset.id); save(); render();
  },
  refreshRate(){ refreshRate(false); },
  saveRate(){
    const v = num($('#rateIn').value);
    if(!(v > 0 && v < 10000)){ toast('100엔당 원 금액을 입력하세요. 예: 930'); return; }
    S.rate = {value:v/100, updated:new Date().toISOString(), source:'manual'};
    save(); render(); toast('환율을 적용했어요.');
  },
  fxDir(){
    const keep = $('#fxIn') ? $('#fxIn').value : '';
    fxDir = fxDir === 'J2K' ? 'K2J' : 'J2K'; render();
    $('#fxIn').value = keep; updateFx();
  },
  async exportData(){
    const txt = JSON.stringify(S);
    try{ await navigator.clipboard.writeText(txt); toast('백업을 복사했어요. 메모 앱에 붙여넣어 두세요.'); }
    catch(e){
      const ta = $('#importTxt'); ta.value = txt; ta.focus(); ta.select();
      toast('아래 칸에 백업을 띄웠어요. 길게 눌러 복사하세요.');
    }
  },
  importData(){
    const raw = $('#importTxt').value.trim();
    if(!raw){ toast('백업 내용을 붙여넣으세요.'); return; }
    try{
      const d = JSON.parse(raw);
      if(!Array.isArray(d.members) || !Array.isArray(d.expenses)) throw 0;
      if(!confirm('지금 데이터를 백업 내용으로 바꿀까요?')) return;
      discardForm(); S = Object.assign(defaults(), d); F = newForm(); cleanPhotos();
      save(); render(); toast('백업을 불러왔어요.');
    }catch(e){ toast('백업 형식이 아니에요. 복사한 내용을 그대로 붙여넣으세요.'); }
  },
  resetAll(){
    if(!confirm('사람, 지출, 예산을 모두 지울까요? 되돌릴 수 없어요.')) return;
    const r = S.rate; discardForm(); S = defaults(); S.rate = r; F = newForm(); cleanPhotos();
    save(); render(); toast('모든 데이터를 지웠어요.');
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(b && A[b.dataset.act]) A[b.dataset.act](b, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'meSel'){ S.meId = t.value || null; save(); render(); }
  else if(t.dataset && t.dataset.f === 'payer') F.payer = t.value;
  else if(t.id === 'photoIn'){ const fl = [...t.files]; t.value = ''; addPhotos(fl); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closePhoto(); });
function fmtInput(el){
  const raw = el.value, caret = el.selectionStart == null ? raw.length : el.selectionStart;
  const before = raw.slice(0, caret).replace(/[^0-9.]/g, '').length;
  const clean = raw.replace(/[^0-9.]/g, '');
  const dot = clean.indexOf('.');
  let ip = dot < 0 ? clean : clean.slice(0, dot);
  const fp = dot < 0 ? '' : clean.slice(dot + 1).replace(/\./g, '');
  ip = ip.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const out = ip + (dot < 0 ? '' : '.' + fp);
  if(out === raw) return;
  el.value = out;
  let pos = 0, n = 0;
  while(pos < out.length && n < before){ if(/[0-9.]/.test(out[pos])) n++; pos++; }
  try{ el.setSelectionRange(pos, pos); }catch(e){}
}
document.addEventListener('input', e => {
  if(e.target.dataset && e.target.dataset.money !== undefined) fmtInput(e.target);
  if(e.target.id === 'fxIn') updateFx();
  if(e.target.closest && e.target.closest('#expForm')) syncForm(e.target);
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const map = {memName:'addMember', budIn:'setBudget', rateIn:'saveRate'};
  if(map[e.target.id]){ e.preventDefault(); A[map[e.target.id]](); }
});

// 좌우로 밀어서 화면 이동
let sx = 0, sy = 0;
document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 80 && Math.abs(dy) < 50 && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
    tab = (tab + (dx < 0 ? 1 : TABS.length - 1)) % TABS.length;
    try{ localStorage.setItem(KEY+':tab', tab); }catch(err){}
    render(); window.scrollTo(0,0);
  }
}, {passive:true});

render();
cleanPhotos();
// 직접 입력한 환율이 아니면, 6시간 지났을 때 자동 갱신
if(S.rate.source !== 'manual' && navigator.onLine &&
   (!S.rate.updated || Date.now() - new Date(S.rate.updated).getTime() > 6*3600e3)){
  refreshRate(true);
}
// 오프라인에서도 열리도록 앱 파일을 폰에 저장 (https 주소에서만 동작, 내 PC 테스트 중에는 끔)
if('serviceWorker' in navigator && location.protocol === 'https:' && !/^(localhost|127\.)/.test(location.hostname)){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
